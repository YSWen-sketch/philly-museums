<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>费城博物馆特展一览</title>
<meta name="description" content="费城博物馆、美术馆与历史宅邸的特展一览，按闭幕日期自动标注。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #F5F6F2;
    --surface: #FFFFFF;
    --ink: #1C2426;
    --ink-2: #4E5A5C;
    --ink-3: #7C8789;
    --line: #DCE0DA;
    --accent: #1F5C5A;
    --accent-soft: #E1EEEC;
    --warn: #9B4A32;
    --warn-soft: #F5E6E0;
    --new: #3E5A9A;
    --new-soft: #E3E8F4;
    --closed: #6B6F6D;
    --closed-soft: #E9EAE7;
    --mark: #FFF1B8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151A1B;
      --surface: #1D2426;
      --ink: #E6E9E4;
      --ink-2: #AEB7B5;
      --ink-3: #7F8988;
      --line: #2E3839;
      --accent: #7CC1BC;
      --accent-soft: #1E3534;
      --warn: #E39A82;
      --warn-soft: #3A2620;
      --new: #9DB4E6;
      --new-soft: #22304A;
      --closed: #9AA19F;
      --closed-soft: #2A302F;
      --mark: #4A4320;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151A1B;
    --surface: #1D2426;
    --ink: #E6E9E4;
    --ink-2: #AEB7B5;
    --ink-3: #7F8988;
    --line: #2E3839;
    --accent: #7CC1BC;
    --accent-soft: #1E3534;
    --warn: #E39A82;
    --warn-soft: #3A2620;
    --new: #9DB4E6;
    --new-soft: #22304A;
    --closed: #9AA19F;
    --closed-soft: #2A302F;
    --mark: #4A4320;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.65;
    padding-inline: 20px;
    padding-block: 40px 80px;
    font-variant-numeric: tabular-nums;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  header h1 {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    font-weight: 700;
    font-size: clamp(28px, 4.5vw, 40px);
    line-height: 1.2;
    margin: 0 0 8px;
    text-wrap: balance;
    letter-spacing: 0.01em;
  }
  header .lede {
    color: var(--ink-2);
    margin: 20px 0 0;
    max-width: 62ch;
  }

  /* masthead */
  .topbar { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 8px 16px; }
  .brand { min-width: 0; flex: 1 1 auto; }
  .brand h1 { margin: 0 0 5px; }
  .brand .tagline { margin: 0; color: var(--ink-3); font-size: 14px; max-width: 48ch; }

  /* city tabs */
  .cities { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 22px; }
  .cities button {
    font: inherit; font-size: 13.5px; line-height: 1.4;
    padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface); color: var(--ink-2); cursor: pointer;
    display: inline-flex; align-items: baseline; gap: 7px;
  }
  .cities button:hover { border-color: var(--ink-3); color: var(--ink); }
  .cities button[aria-pressed="true"] { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .cities button i {
    font-style: normal; font-size: 12px; opacity: 0.65;
    font-variant-numeric: tabular-nums;
  }
  .cities button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* per-city figures */
  .stats {
    display: flex; flex-wrap: wrap; gap: 2px 18px;
    margin-top: 14px; color: var(--ink-3); font-size: 13px;
  }
  .stats b { color: var(--ink-2); font-weight: 600; }

  /* jump links to each group */
  .jump { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 18px; }
  .jump a {
    font-size: 13px; color: var(--ink-2); text-decoration: none;
    padding: 4px 11px; border-radius: 999px; border: 1px solid transparent;
    display: inline-flex; align-items: baseline; gap: 6px;
  }
  .jump a:hover { border-color: var(--line); background: var(--surface); color: var(--accent); }
  .jump a i { font-style: normal; color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lang {
    display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 999px;
    overflow: hidden; background: var(--surface); margin-top: 6px;
  }
  .lang button {
    font: inherit; font-size: 13px; line-height: 1.4;
    padding: 5px 12px; border: 0; background: none; color: var(--ink-2); cursor: pointer;
  }
  .lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* summary strip */
  .strip {
    margin-top: 28px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 12px;
  }
  .strip section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .strip h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .strip h2 b { color: var(--ink); font-weight: 700; letter-spacing: 0; text-transform: none; font-size: 13px; }
  .strip ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .strip li { display: grid; grid-template-columns: 5.2em 1fr; gap: 10px; font-size: 13.5px; line-height: 1.45; }
  .strip li .d { color: var(--ink-3); white-space: nowrap; }
  .strip li .d.soon { color: var(--warn); font-weight: 500; }
  .strip li .d.new { color: var(--new); font-weight: 500; }

  /* controls */
  .controls {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    padding-block: 14px 10px;
    margin-top: 28px;
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .controls input {
    flex: 1 1 220px;
    font: inherit;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--ink);
    min-width: 0;
  }
  .controls input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .chip {
    font: inherit; font-size: 13px;
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-2);
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .count { font-size: 13px; color: var(--ink-3); margin-left: auto; }

  /* groups */
  .group { margin-top: 40px; scroll-margin-top: 64px; }
  .group > h2 {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .group > p.note { margin: 0 0 14px; color: var(--ink-2); font-size: 14px; max-width: 65ch; }

  .museum {
    border-top: 1px solid var(--line);
    padding-block: 18px;
    display: grid;
    grid-template-columns: minmax(180px, 34%) 1fr;
    gap: 8px 24px;
  }
  @media (max-width: 640px) { .museum { grid-template-columns: 1fr; } }
  .museum h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.35; }
  .museum h3 small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
  .museum h3 a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
  .museum h3 a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  .museum .facts { color: var(--ink-2); font-size: 13px; line-height: 1.55; margin-top: 4px; }
  .museum .facts span { display: block; }
  .museum .flag {
    display: inline-block; margin-top: 6px;
    font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 4px;
    background: var(--warn-soft); color: var(--warn);
  }
  .museum .flag.closed { background: var(--closed-soft); color: var(--closed); }

  .shows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .show { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: start; }
  .show .t { font-weight: 500; }
  .show .t em { font-style: normal; color: var(--ink-2); font-weight: 400; }
  .show .dates { color: var(--ink-3); font-size: 13px; white-space: nowrap; text-align: right; }
  .show .desc { grid-column: 1 / -1; color: var(--ink-2); font-size: 13.5px; margin-top: -2px; }
  .tag {
    display: inline-block; vertical-align: 1px; margin-left: 6px;
    font-size: 11.5px; font-weight: 500; letter-spacing: 0.02em;
    padding: 1px 7px; border-radius: 4px;
  }
  .tag.on { background: var(--accent-soft); color: var(--accent); }
  .tag.soon { background: var(--warn-soft); color: var(--warn); }
  .tag.new { background: var(--new-soft); color: var(--new); }
  .tag.over { background: var(--closed-soft); color: var(--closed); }
  .none { color: var(--ink-3); font-size: 14px; }
  mark { background: var(--mark); color: inherit; padding: 0 1px; }

  .plain { display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; }
  .plain b { color: var(--ink); font-weight: 500; }
  .plain a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
  .plain a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  footer a { color: inherit; }
  footer { margin-top: 48px; color: var(--ink-3); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; max-width: 70ch; }
  .hidden { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .museum { transition: opacity .15s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <div class="brand">
        <h1 id="title"></h1>
        <p class="tagline" id="tagline"></p>
      </div>
      <div class="lang" role="group" id="lang">
        <button type="button" data-lang="zh" lang="zh-CN">中文</button>
        <button type="button" data-lang="en" lang="en">English</button>
      </div>
    </div>
    <nav class="cities" id="cities"></nav>
    <p class="lede" id="lede"></p>
    <p class="stats" id="stats"></p>
  </header>

  <div class="strip" id="strip"></div>

  <div class="controls">
    <input id="q" type="search">
    <button class="chip" data-f="all" aria-pressed="true"></button>
    <button class="chip" data-f="soon" aria-pressed="false"></button>
    <button class="chip" data-f="new" aria-pressed="false"></button>
    <button class="chip" data-f="free" aria-pressed="false"></button>
    <span class="count" id="count"></span>
  </div>

  <nav class="jump" id="jump"></nav>

  <div id="groups"></div>

  <footer id="foot"></footer>
</div>

<script>var CITIES = [];</script>
<script src="data/philadelphia.js"></script>
<script src="data/newyork.js"></script>
<script src="data/washington.js"></script>
<script src="data/boston.js"></script>
<script>
const REPO = "https://github.com/YSWen-sketch/philly-museums";

// ---------- interface strings ----------
const STR = {
  zh: {
    site: "东岸看展",
    tagline: "费城、纽约、华盛顿、波士顿的博物馆特展",
    tab: (city) => "东岸看展 · " + city,
    desc: (city) => city + "的博物馆、美术馆与历史宅邸正在展出什么，按闭幕日期自动标注。",
    cities: "选择城市",
    stats: (v, e, f, d) => [`<b>${v}</b> 家场馆`, `<b>${e}</b> 个展览在展`, `<b>${f}</b> 家免费`, `核对于 ${d}`],
    jumpAll: "全部",
    search: "搜索馆名或展览…",
    all: "全部", soon: "30 天内闭幕", opening: "即将开幕", free: "免费入场",
    count: (a, b) => `${a} / ${b} 家`,
    stripSoon: "30 天内闭幕", stripNew: "45 天内开幕",
    on: "进行中", willOpen: "即将开幕", over: "已结束",
    lastDay: "今天最后一天", daysLeft: (n) => `还剩 ${n} 天`,
    until: (t) => "至 " + t,
    noMatch: "无符合筛选的展览", noShows: "目前无特展，常设展开放",
    empty: "没有匹配的结果。",
    plainTitle: "无特展的常设馆",
    plainNote: "这些馆只有常设展或季节性活动，列出方便一并规划。",
    closedTitle: "已关闭",
    foot: (note) => `票价为成人价，开馆时间以官网为准，节假日常有调整。状态标签按打开页面当天的日期计算。${note}`,
    footAuto: '本页每周四由自动程序核对各馆官网后更新，源码与更新记录见 <a href="REPO" target="_blank" rel="noopener">GitHub</a>。'
  },
  en: {
    site: "On View",
    tagline: "Museum exhibitions in Philadelphia, New York, Washington and Boston",
    tab: (city) => "On View · " + city,
    desc: (city) => `What is on view at ${city}'s museums, galleries and historic houses, with closing dates marked automatically.`,
    cities: "Choose a city",
    stats: (v, e, f, d) => [`<b>${v}</b> venues`, `<b>${e}</b> exhibitions on view`, `<b>${f}</b> free`, `checked ${d}`],
    jumpAll: "All",
    search: "Search a museum or exhibition…",
    all: "All", soon: "Closing in 30 days", opening: "Opening soon", free: "Free admission",
    count: (a, b) => `${a} of ${b} venues`,
    stripSoon: "Closing within 30 days", stripNew: "Opening within 45 days",
    on: "On view", willOpen: "Opening soon", over: "Closed",
    lastDay: "Last day today", daysLeft: (n) => n === 1 ? "1 day left" : `${n} days left`,
    until: (t) => "Until " + t,
    noMatch: "Nothing here matches the filter", noShows: "No special exhibition right now; the permanent collection is open",
    empty: "No results.",
    plainTitle: "Permanent collections, no special exhibition",
    plainNote: "These venues show only their permanent collection or seasonal programming. Listed so you can plan around them.",
    closedTitle: "Closed for good",
    foot: (note) => `Prices are adult admission and hours follow the museums' own websites, which often shift around holidays. Status tags are computed from the date you open the page. ${note}`,
    footAuto: 'This page is reconciled against the museums\' websites every Thursday by an automated agent. Source and changelog on <a href="REPO" target="_blank" rel="noopener">GitHub</a>.'
  }
};

// ---------- language and city ----------
const PARAMS = new URLSearchParams(location.search);
function remembered(key, valid, fallback) {
  const q = PARAMS.get(key);
  if (valid(q)) return q;
  try { const v = localStorage.getItem(key); if (valid(v)) return v; } catch (e) {}
  return fallback();
}
let LANG = remembered("lang", (v) => v === "en" || v === "zh",
  () => (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
let CITY = remembered("city", (v) => CITIES.some((c) => c.id === v),
  () => (CITIES[0] || {}).id);

const T = () => STR[LANG];
const zh = () => LANG === "zh";
const C = () => CITIES.find((c) => c.id === CITY) || CITIES[0];
// Pick the localized variant of a field: `k` in English, `k + "z"` in Chinese.
const L = (o, k) => (zh() ? (o[k + "z"] || o[k]) : o[k]) || "";

function remember(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }

// ---------- helpers ----------
const today = new Date(); today.setHours(0,0,0,0);
const MS = 86400000;
const EN_MONTH = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function parse(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
function fmt(s){
  const d = parse(s), sameYear = d.getFullYear() === today.getFullYear();
  if (zh()) return (sameYear ? "" : d.getFullYear() + "/") + (d.getMonth()+1) + "/" + d.getDate();
  return EN_MONTH[d.getMonth()] + " " + d.getDate() + (sameYear ? "" : ", " + d.getFullYear());
}
function mday(d){ return zh() ? (d.getMonth()+1) + "/" + d.getDate() : EN_MONTH[d.getMonth()] + " " + d.getDate(); }
function status(sh){
  const t = T();
  if (sh.s && parse(sh.s) > today) return { k: "new", label: t.willOpen };
  if ((sh.sText || sh.sTextz) && !sh.s) return { k: "new", label: t.willOpen };
  if (sh.e) {
    const days = Math.round((parse(sh.e) - today) / MS);
    if (days < 0) return { k: "over", label: t.over };
    if (days <= 30) return { k: "soon", label: days === 0 ? t.lastDay : t.daysLeft(days) };
  }
  return { k: "on", label: t.on };
}
function dateText(sh){
  const a = sh.s ? fmt(sh.s) : L(sh, "sText");
  const b = sh.e ? fmt(sh.e) : L(sh, "eText");
  if (a && b) return a + " – " + b.replace(/^(至 ?|Through |Until )/, "");
  if (b) return (!sh.e) ? b : T().until(b);
  return a;
}
function esc(t){ return String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hl(text, q){
  text = String(text);
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}
// The heading shows both names in Chinese, the official name alone in English.
function bothNames(o){ return zh() && o.nz ? o.n + " " + o.nz : o.n; }

// ---------- chrome ----------
// Venues in a city, and the exhibitions that have not already closed.
function tally(c){
  const venues = c.groups.reduce((a, g) => a + g.items.length, 0);
  let onView = 0, free = 0;
  c.groups.forEach(g => g.items.forEach(m => {
    if (m.free) free++;
    m.shows.forEach(sh => { if (status(sh).k !== "over") onView++; });
  }));
  return { venues, onView, free };
}

function chrome(){
  const t = T(), c = C(), city = L(c, "n");
  document.documentElement.lang = zh() ? "zh-CN" : "en";
  document.title = t.tab(city);
  const md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute("content", t.desc(city));
  document.getElementById("title").textContent = t.site;
  document.getElementById("tagline").textContent = t.tagline;
  document.getElementById("lede").textContent = L(c, "lede");
  document.getElementById("q").placeholder = t.search;
  document.getElementById("q").setAttribute("aria-label", t.search);
  const labels = { all: t.all, soon: t.soon, new: t.opening, free: t.free };
  document.querySelectorAll(".chip").forEach(b => { b.textContent = labels[b.dataset.f]; });
  document.getElementById("foot").innerHTML =
    esc(t.foot(L(c, "note"))) + "<br>" + t.footAuto.replace("REPO", esc(REPO));
  document.querySelectorAll("#lang button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === LANG)));

  const nav = document.getElementById("cities");
  nav.setAttribute("aria-label", t.cities);
  nav.innerHTML = CITIES.map(x => {
    const n = tally(x).venues;
    return `<button type="button" data-city="${esc(x.id)}" aria-pressed="${x.id === CITY}">` +
           `${esc(L(x, "n"))}<i>${n}</i></button>`;
  }).join("");
  nav.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.city === CITY) return;
    CITY = b.dataset.city; remember("city", CITY);
    document.getElementById("q").value = "";
    draw();
    window.scrollTo({ top: 0, behavior: "instant" });
  }));

  const s = tally(c);
  document.getElementById("stats").innerHTML =
    t.stats(s.venues, s.onView, s.free, L(c, "updated")).map(x => `<span>${x}</span>`).join("");
}

// ---------- summary strip ----------
function buildStrip(){
  const t = T(), soon = [], opening = [];
  C().groups.forEach(g => g.items.forEach(m => m.shows.forEach(sh => {
    const st = status(sh);
    if (st.k === "soon") soon.push({ d: parse(sh.e), t: sh.t, m });
    if (st.k === "new" && sh.s) { const d = parse(sh.s); if ((d - today)/MS <= 45) opening.push({ d, t: sh.t, m }); }
  })));
  soon.sort((a,b)=>a.d-b.d); opening.sort((a,b)=>a.d-b.d);
  const short = (m) => zh() ? (m.nz || m.n) : m.n.replace(/\s*\(.*$/, "").trim();
  const li = (x, cls) => `<li><span class="d ${cls}">${esc(mday(x.d))}</span><span>${esc(x.t)}<br><span style="color:var(--ink-3)">${esc(short(x.m))}</span></span></li>`;
  document.getElementById("strip").innerHTML =
    `<section><h2>${esc(t.stripSoon)} <b>${soon.length}</b></h2><ul>${soon.slice(0,8).map(x=>li(x,"soon")).join("")}</ul></section>` +
    `<section><h2>${esc(t.stripNew)} <b>${opening.length}</b></h2><ul>${opening.slice(0,8).map(x=>li(x,"new")).join("")}</ul></section>`;
}

// ---------- groups ----------
function render(){
  const t = T(), c = C();
  const q = document.getElementById("q").value.trim();
  const f = document.querySelector(".chip[aria-pressed='true']").dataset.f;
  let shown = 0, total = 0;
  const jump = [];
  const html = c.groups.map((g, gi) => {
    let inGroup = 0;
    const items = g.items.map(m => {
      total++;
      const name = bothNames(m);
      let shows = m.shows.map(sh => ({ sh, st: status(sh) })).filter(x => x.st.k !== "over");
      if (f === "soon") shows = shows.filter(x => x.st.k === "soon");
      if (f === "new") shows = shows.filter(x => x.st.k === "new");
      const hay = (name + " " + m.shows.map(s => s.t + " " + L(s, "d")).join(" ")).toLowerCase();
      const matchQ = !q || hay.includes(q.toLowerCase());
      const matchF = f === "all" || (f === "free" ? !!m.free : shows.length > 0);
      if (!matchQ || !matchF) return "";
      if (q) shows = shows.filter(x => name.toLowerCase().includes(q.toLowerCase()) || (x.sh.t + " " + L(x.sh, "d")).toLowerCase().includes(q.toLowerCase()));
      shown++; inGroup++;
      const showsHtml = shows.length
        ? `<ul class="shows">${shows.map(({sh, st}) => `<li class="show">
            <span class="t">${hl(sh.t, q)}<span class="tag ${st.k}">${esc(st.label)}</span></span>
            <span class="dates">${esc(dateText(sh))}</span>
            ${L(sh, "d") ? `<span class="desc">${hl(L(sh, "d"), q)}</span>` : ""}
          </li>`).join("")}</ul>`
        : `<p class="none">${esc(m.shows.length ? t.noMatch : t.noShows)}</p>`;
      const heading = m.u ? `<a href="${esc(m.u)}" target="_blank" rel="noopener">${hl(name, q)}</a>` : hl(name, q);
      return `<article class="museum">
        <div>
          <h3>${heading}<small>${esc(m.a)}</small></h3>
          <div class="facts"><span>${esc(L(m, "h"))}</span><span>${esc(L(m, "p"))}</span></div>
          ${L(m, "flag") ? `<span class="flag">${esc(L(m, "flag"))}</span>` : ""}
        </div>
        ${showsHtml}
      </article>`;
    }).join("");
    if (!items) return "";
    jump.push({ id: "g" + gi, label: L(g, "g"), n: inGroup });
    return `<section class="group" id="g${gi}"><h2>${esc(L(g, "g"))}</h2>` +
           `<p class="note">${esc(L(g, "note"))}</p>${items}</section>`;
  }).join("");

  const row = (x) => {
    const nm = esc(bothNames(x));
    return `<div><b>${x.u ? `<a href="${esc(x.u)}" target="_blank" rel="noopener">${nm}</a>` : nm}</b> · ${esc(L(x, "d"))}</div>`;
  };
  const extras = (f === "all" && !q)
    ? ((c.plain || []).length
        ? `<section class="group"><h2>${esc(t.plainTitle)}</h2><p class="note">${esc(t.plainNote)}</p>
           <div class="plain">${c.plain.map(row).join("")}</div></section>` : "")
      + ((c.closed || []).length
        ? `<section class="group"><h2>${esc(t.closedTitle)}</h2><div class="plain">${c.closed.map(row).join("")}</div></section>` : "")
    : "";

  document.getElementById("groups").innerHTML =
    (html || `<p class="none" style="margin-top:24px">${esc(t.empty)}</p>`) + extras;
  // The stats row already carries the total, so the count only earns its place
  // once a filter or a search has narrowed the list.
  document.getElementById("count").textContent = (shown === total) ? "" : t.count(shown, total);
  // Jump links earn their place only when there is more than one group to jump to.
  document.getElementById("jump").innerHTML = jump.length > 1
    ? jump.map(j => `<a href="#${j.id}">${esc(j.label)}<i>${j.n}</i></a>`).join("")
    : "";
}

function draw(){ chrome(); buildStrip(); render(); }

document.getElementById("q").addEventListener("input", render);
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", "false"));
  b.setAttribute("aria-pressed", "true");
  render();
}));
document.querySelectorAll("#lang button").forEach(b => b.addEventListener("click", () => {
  LANG = b.dataset.lang; remember("lang", LANG); draw();
}));
draw();
</script>
</body>
</html>
